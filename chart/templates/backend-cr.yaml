apiVersion: apps.taskapp.io/v1alpha1
kind: Backend
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
spec:
  image: {{ .Values.image.repository }}
  tag: {{ .Values.image.tag | quote }}
  replicas: {{ .Values.replicas }}
  {{- if .Values.database.enabled }}
  database:
    dbName: {{ .Values.database.dbName }}
    size: {{ .Values.database.size }}
    {{- if .Values.database.schema.sql }}
    schema:
      sql: |
        {{- .Values.database.schema.sql | trimSuffix "\n" | nindent 8 }}
    {{- end }}
  {{- end }}
  {{- if .Values.queue.enabled }}
  queue:
    type: {{ .Values.queue.type }}
    deadLetter: {{ .Values.queue.deadLetter }}
  {{- end }}
